<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> calc: short for calculator </title>
    <!-- Linked external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1> calc (short for calculator) </h1>
    <div class="container">
        <!-- 1. Standard Calculator Panel -->
        <div class="calculator">
            <h3>Standard calc </h3>
            <input type="text" id="display">
            <div class="buttons">
                <button onclick="appendValue('0')">0</button>
                <button onclick="appendValue('1')">1</button>
                <button onclick="appendValue('2')">2</button>
                <button onclick="appendValue('3')">3</button>
                <button onclick="appendValue('4')">4</button>
                <button onclick="appendValue('5')">5</button>
                <button onclick="appendValue('6')">6</button>
                <button onclick="appendValue('7')">7</button>
                <button onclick="appendValue('8')">8</button>
                <button onclick="appendValue('9')">9</button>
                <button onclick="appendValue('.')">.</button>
                <button class="operator" onclick="appendValue('/')">/</button>
                <button class="operator" onclick="appendValue('*')">*</button>
                <button class="operator" onclick="appendValue('-')">-</button>
                <button class="operator" onclick="appendValue('+')">+</button>
                <button class="operator" onclick="clearDisplay()">Clear</button>
               
                <button class="equal" onclick="calculate()">=</button>

            </div>
        </div>

        <!-- 2. Advanced Math & Text Input Panel -->
        <div class="panel">
            <h3>Math class calculations</h3>
            <input type="text" id="mathInput" class="text-input" placeholder="ex, 5 or 4,3">
            <div class="panel-buttons">
                <button class="operator" onclick="runMathOperation('round')">Round</button>
                <button class="operator" onclick="runMathOperation('pow')">Pow (x^y)</button>
                <button class="operator" onclick="runMathOperation('sqrt')">Sqrt</button>
                <button class="operator" onclick="runMathOperation('pi')">Multiply Pi</button>
            </div>
            <div id="mathResult" class="message-box" style="margin-top: 15px; font-weight: bold;">Result: </div>
        </div>

        <!-- file Upload & stat calculations panel -->
        <div class="panel">
            <h3>Statistics & file upload </h3>
            <input type="file" id="fileToLoad" onchange="checkFileProperty()">
            <div id="Message" class="message-box">Select a CSV/text file...</div>
            <textarea id="fileInput" class="file-textarea" placeholder="Data loaded here..."></textarea>
            <div class="panel-buttons">
                <button class="operator" onclick="calculateStats('mean')">Mean</button>
                <button class="operator" onclick="calculateStats('median')">Median</button>
                <button class="operator" onclick="calculateStats('mode')">Mode</button>
                <button class="operator" onclick="calculateStats('summary')">Min/Max</button>
            </div>
            <div id="statResult" class="message-box" style="margin-top: 10px; font-weight: bold;">Stat: </div>
        </div>
    </div>

    <!-- 3. Graphing Panel -->
    <div class = "graphing-panel">
        <input id="graphInput" aria-label="Graph 1 (red)" value="sin(x)" placeholder="Graph 1 (red)" style="color: red">
        <input id="graphInput2" aria-label="Graph 2 (blue)" placeholder="Graph 2 (blue)" style="color: blue">
        <input id="graphInput3" aria-label="Graph 3 (green)" placeholder="Graph 3 (green)" style="color: green">
        <button onclick="drawGraph()">Graph</button>
        <button onclick="zoom = Math.min(32, zoom*2); drawGraph()">Zoom in</button>
        <button onclick="zoom = Math.max(0.125, zoom/2); drawGraph()">Zoom out</button>
        <button onclick="centerX -= 1/zoom; drawGraph()">Left</button>
        <button onclick="centerX += 1/zoom; drawGraph()">Right</button>
        <button onclick="centerY += 1/zoom; drawGraph()">Up</button>
        <button onclick="centerY -= 1/zoom; drawGraph()">Down</button>
    </div>
    <canvas id="canvas"></canvas>
    <!-- linked JavaScript files -->
    <script src="saveText.js"></script>
    <script src="readTextArea.js"></script>
    <script src="script.js">  </script>
    <script src="script2.js"></script>
</body>
</html>
